name: CI/CD Pipeline

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-cicdappp .

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name test-container my-cicdappp

      - name : Test container
        run: |
          sleep 5
          curl -f http://localhost:8080 || exit 1
      
      - name: Stop container
        run: docker Stop test-container
